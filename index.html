<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SUB Config Decoder — Stable</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
--bg:#0b1020;--card:#151c2f;--accent:#5c7cff;--text:#e6eef8;
--muted:#94a3b8;--border:1px solid rgba(255,255,255,.08)
}
[data-theme="light"]{
--bg:#f8fafc;--card:#fff;--accent:#4f46e5;--text:#1e293b;
--muted:#64748b;--border:1px solid rgba(0,0,0,.08)
}
*{box-sizing:border-box;font-family:Inter,Segoe UI}
body{margin:0;background:var(--bg);color:var(--text);padding:16px}
.container{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 360px;gap:16px}
.card{background:var(--card);border-radius:16px;padding:16px;border:var(--border)}
textarea,input,button{
background:#00000030;color:var(--text);border-radius:10px;
border:var(--border);padding:12px
}
textarea{width:100%;height:380px;font-family:monospace}
button{cursor:pointer;background:var(--accent);border:none;font-weight:600}
button.ghost{background:transparent;border:var(--border)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:13px;color:var(--muted)}
.history div{cursor:pointer;padding:6px;border-radius:6px}
.history div:hover{background:#ffffff10}
@media(max-width:900px){
.container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="card">
<h2>🚀 SUB Decoder (Stable Version)</h2>
<p class="small">Paste subscription link / Base64 / config</p>

<div class="row">
<input id="sub" placeholder="https://example.com/sub.txt or vmess://..." style="flex:1">
<button onclick="generate()">Generate</button>
</div>

<div class="row" style="margin-top:8px">
<button class="ghost" onclick="copyAll()">📋 Copy</button>
<button class="ghost" onclick="downloadTXT()">TXT</button>
<button class="ghost" onclick="downloadJSON()">JSON</button>
<button class="ghost" onclick="clearAll()">Clear</button>
</div>

<input id="search" placeholder="Search..." style="margin-top:10px;width:100%">

<textarea id="output" readonly></textarea>

<p class="small" id="cnt"></p>
</div>

<!-- RIGHT -->
<div class="card">

<h4>⚙ Settings</h4>
<button class="ghost" onclick="toggleTheme()">Theme</button>

<h4>🕘 History</h4>
<div class="history small" id="history"></div>

<h4>ℹ Info</h4>
<ul class="small">
<li>Base64 Auto Decode</li>
<li>VMESS Parse Fix</li>
<li>Safe Render Engine</li>
</ul>

<hr style="border:var(--border);margin:10px 0">

<div class="small">
<p><strong>👨‍💻 Creator:</strong> xsparvin</p>
<p>
📢 Telegram:<br>
<a href="https://t.me/xsfilterrnet" target="_blank" style="color:var(--accent);text-decoration:none">
https://t.me/xsfilterrnet
</a>
</p>
</div>

</div>

</div>

<script>
const out=document.getElementById("output");
const sub=document.getElementById("sub");
let all=[];

/* ---------- Base64 safe ---------- */
function decodeB64(str){
try{
str=str.trim()
.replace(/-/g,'+')
.replace(/_/g,'/');

while(str.length % 4) str+='=';

return decodeURIComponent(atob(str).split('').map(c=>
'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)
).join(''));
}catch{return null}
}

/* ---------- VMESS ---------- */
function decodeVmess(str){
try{
let raw=str.replace("vmess://","");
let d=decodeB64(raw);
return d?JSON.parse(d):null;
}catch{return null}
}

/* ---------- Main ---------- */
async function generate(){
let v=sub.value.trim();
if(!v) return;

saveHistory(v);

if(v.startsWith("http")){
try{
let r=await fetch(v);
v=await r.text();
}catch{
alert("Fetch failed (CORS or invalid link)");
return;
}
}

let lines=v.split(/\r?\n/).filter(Boolean);
let res=[];

lines.forEach(l=>{

if(l.startsWith("vmess://")){
let j=decodeVmess(l);
if(j) res.push(JSON.stringify(j,null,2));
else res.push(l);
}

else{
let d=decodeB64(l);
res.push(d || l);
}

});

all=res;
render();
}

/* ---------- Render ---------- */
function render(){
let q=document.getElementById("search").value.toLowerCase();

let f=all.filter(x=>x.toLowerCase().includes(q));

out.value=f.join("\n\n");

document.getElementById("cnt").textContent=
`Total Lines: ${all.length}`;
}

document.getElementById("search").oninput=render;

/* ---------- Export ---------- */
function copyAll(){
navigator.clipboard.writeText(out.value);
}

function downloadTXT(){
dl(out.value,"configs.txt");
}

function downloadJSON(){
dl(JSON.stringify(all,null,2),"configs.json");
}

function dl(c,n){
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([c]));
a.download=n;
a.click();
}

/* ---------- Theme ---------- */
function toggleTheme(){
let t=document.documentElement.getAttribute("data-theme");
t=t==="light"?"dark":"light";
document.documentElement.setAttribute("data-theme",t);
localStorage.theme=t;
}

if(localStorage.theme)
document.documentElement.setAttribute("data-theme",localStorage.theme);

/* ---------- History ---------- */
function saveHistory(v){
let h=JSON.parse(localStorage.h||"[]");
h.unshift(v);
h=[...new Set(h)].slice(0,5);
localStorage.h=JSON.stringify(h);
loadHistory();
}

function loadHistory(){
let h=JSON.parse(localStorage.h||"[]");
let el=document.getElementById("history");
el.innerHTML="";
h.forEach(x=>{
let d=document.createElement("div");
d.textContent=x.slice(0,40);
d.onclick=()=>{sub.value=x;generate()}
el.appendChild(d);
});
}
loadHistory();

/* ---------- Clear ---------- */
function clearAll(){
sub.value="";
out.value="";
all=[];
document.getElementById("cnt").textContent="";
}
</script>

</body>
</html>
